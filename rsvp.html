<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>참석 여부 응답 · 진원이 송별회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="topbar">
    <a class="icon-btn" href="index.html" aria-label="초대장으로 돌아가기">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span class="topbar-title">참석 여부 응답</span>
    <span style="width: 44px;"></span>
  </header>

  <form class="form" id="rsvp-form" novalidate>
    <div class="form-body">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <p class="caption">진원이 송별회 · 10. 1 (목)</p>
        <h1 class="h1">함께하실 수 있나요?</h1>
      </div>

      <div class="field">
        <label class="field-label" for="name">이름</label>
        <input class="input" id="name" name="name" type="text" placeholder="이름을 입력하세요" autocomplete="name" required>
        <p class="error" id="name-error" hidden>이름을 입력해 주세요.</p>
      </div>

      <div class="field" role="group" aria-labelledby="first-label">
        <span class="field-label" id="first-label">1차 참석 여부</span>
        <div class="choices">
          <button type="button" class="choice" data-group="first" data-value="yes" aria-pressed="true">
            <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>참석
          </button>
          <button type="button" class="choice" data-group="first" data-value="no" aria-pressed="false">
            <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>불참
          </button>
          <button type="button" class="choice" data-group="first" data-value="maybe" aria-pressed="false">
            <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>미정
          </button>
        </div>
      </div>

      <div class="field" id="second-field" role="group" aria-labelledby="second-label">
        <span class="field-label" id="second-label">2차도 함께하시나요?</span>
        <p class="caption">자룡 T가 2차에 합류하십니다.</p>
        <div class="choices two">
          <button type="button" class="choice" data-group="second" data-value="yes" aria-pressed="true" style="height: 52px;">
            <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>함께해요
          </button>
          <button type="button" class="choice" data-group="second" data-value="no" aria-pressed="false" style="height: 52px;">
            <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>1차만
          </button>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="message">진원이에게 한마디 <span class="opt">(선택)</span></label>
        <textarea class="input" id="message" name="message" maxlength="300" placeholder="송별 메시지나 주최자에게 전할 말을 남겨주세요"></textarea>
      </div>
    </div>

    <div class="bottom-bar">
      <p class="caption" style="text-align: center;">응답은 [회신 마감일]까지 수정할 수 있습니다.</p>
      <button type="submit" class="btn btn-primary" id="submit">응답 보내기</button>
    </div>
  </form>
</main>

<script>
  const state = { first: 'yes', second: 'yes' };
  const secondField = document.getElementById('second-field');

  document.querySelectorAll('[data-group]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const group = btn.dataset.group;
      state[group] = btn.dataset.value;
      document.querySelectorAll('[data-group="' + group + '"]').forEach((b) => {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      secondField.hidden = state.first !== 'yes';
    });
  });

  document.getElementById('rsvp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nameInput = document.getElementById('name');
    const nameError = document.getElementById('name-error');
    const name = nameInput.value.trim();

    if (!name) {
      nameInput.setAttribute('aria-invalid', 'true');
      nameError.hidden = false;
      nameInput.focus();
      return;
    }
    nameInput.removeAttribute('aria-invalid');
    nameError.hidden = true;

    const payload = {
      name: name,
      first: state.first,                                  // yes | no | maybe
      second: state.first === 'yes' ? state.second : '',   // yes | no | ''
      message: document.getElementById('message').value.trim(),
      createdAt: new Date().toISOString()
    };

    const submitBtn = document.getElementById('submit');
    submitBtn.disabled = true;
    submitBtn.textContent = '보내는 중…';

    try {
      // TODO: 백엔드로 전송 (예: Apps Script 웹 앱 URL로 POST)
      // await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      sessionStorage.setItem('rsvp', JSON.stringify(payload));
      location.href = 'done.html';
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = '응답 보내기';
      alert('전송에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    }
  });
</script>
</body>
</html>
